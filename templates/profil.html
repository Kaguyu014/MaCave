{% extends 'base.html' %}

{% block content %}
<div class="dashboard-container">
    <section class="section-card" style="max-width: 500px; margin: 0 auto;">
        <h2>Mon Profil ({{ user.username }})</h2>
        <form action="{{ url_for('profil') }}" method="post" class="form-grid" style="grid-template-columns: 1fr;">
            <div class="form-group">
                <label>Adresse Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>
            <div class="form-group">
                <label>Nouveau mot de passe (laisser vide pour conserver l'actuel)</label>
                <input type="password" name="password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Enregistrer les modifications</button>
        </form>
    </section>
</div>
{% endblock %}
